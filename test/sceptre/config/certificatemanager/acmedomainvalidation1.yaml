---
template:
  type: file
  path: certificatemanager/acme_domain_validation.yaml.j2

sceptre_user_data:
  # Custom template description (optional - defaults to CertificateManager Acme Domain Validation(s) for <project_code>)
  description: "CertificateManager AcmeDomainValidation Test Suite covering all template variables"
  project_code: "{{project_code}}"
  source_repo_url: "{{git_repo}}"
  acme_domain_validations:
    # ========== Test: Full DNS prevalidation with domain scope ==========
    - name: ExampleComValidation
      acme_endpoint_arn: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/example-acme-endpoint"
      domain_name: example.com
      prevalidation_options:
        dns_prevalidation:
          domain_scope:
            exact_domain: example.com
            subdomains: "true"
            wildcards: "false"
          hosted_zone_id: Z1D633PJN98FT9
      tags:
        Owner: PlatformTeam
        Service: CertificateManager

    # ========== Test: Minimal properties, no prevalidation options ==========
    - name: ApiExampleComValidation
      domain_name: api.example.com
      tags:
        Owner: PlatformTeam
        Service: CertificateManager

stack_tags:
  TestSuite: "CertificateManager AcmeDomainValidation Coverage"
  TemplateVersion: "AcmeDomainValidation Test"
  Version: "1.0.0"
