---
template:
  type: file
  path: certificatemanager/acme_external_account_binding.yaml.j2

sceptre_user_data:
  # Custom template description (optional - defaults to CertificateManager Acme External Account Binding(s) for <project_code>)
  description: "CertificateManager AcmeExternalAccountBinding Test Suite covering all template variables"
  project_code: "{{project_code}}"
  source_repo_url: "{{git_repo}}"
  acme_external_account_bindings:
    # ========== Test: Full properties with expiration and tags ==========
    - name: ExampleAccountBinding
      acme_endpoint_arn: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/example-acme-endpoint"
      role_arn: "arn:aws:iam::123456789012:role/AcmeExternalAccountBindingRole"
      expiration:
        type: DURATION_HOURS
        value: 72
      tags:
        Owner: PlatformTeam
        Service: CertificateManager

    # ========== Test: Minimal required properties only ==========
    - name: MinimalAccountBinding
      acme_endpoint_arn: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/minimal-acme-endpoint"
      role_arn: "arn:aws:iam::123456789012:role/MinimalAcmeExternalAccountBindingRole"
      tags:
        Owner: PlatformTeam
        Service: CertificateManager

stack_tags:
  TestSuite: "CertificateManager AcmeExternalAccountBinding Coverage"
  TemplateVersion: "AcmeExternalAccountBinding Test"
  Version: "1.0.0"
