---
template:
  type: file
  path: securityagent/application.yaml.j2

sceptre_user_data:
  project_code: "{{ project_code }}"
  source_repo_url: "{{ git_repo }}"
  description: CloudFormation template to test SecurityAgent Application with comprehensive Jinja2 template coverage.
  applications:
    - name: BasicApplication
      tags:
        Environment: Development
        Purpose: BasicSecurityAgentApp

    - name: WithIdCConfiguration
      deletion_policy: Retain
      update_replace_policy: Retain
      idc_configuration:
        idc_instance_arn: arn:aws:identitystore::123456789012:identitystore/d-1234567890
        idc_application_arn: arn:aws:sso::123456789012:application/sso/us-east-1/app-abcdef0123456789
      tags:
        Environment: Production
        Application: IdCIntegrated
        Owner: SecurityTeam

    - name: FullFeaturedApplication
      deletion_policy: Retain
      update_replace_policy: Retain
      default_kms_key_id: arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012
      idc_configuration:
        idc_instance_arn: arn:aws:identitystore::123456789012:identitystore/d-0987654321
        idc_application_arn: arn:aws:sso::123456789012:application/sso/us-east-1/app-fedcba9876543210
      role_arn: arn:aws:iam::123456789012:role/SecurityAgentApplicationRole
      tags:
        Environment: Production
        Application: FullFeaturedSecurityAgent
        CostCenter: Security
        DataClassification: Sensitive
        Owner: CloudEngineering

stack_tags:
  Test: securityagent-application
