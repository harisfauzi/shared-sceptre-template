---
template:
  type: file
  path: securityagent/agent_space.yaml.j2

sceptre_user_data:
  project_code: "{{ project_code }}"
  source_repo_url: "{{ git_repo }}"
  description: CloudFormation template to test SecurityAgent AgentSpace with comprehensive Jinja2 template coverage.
  agent_spaces:
    - name: BasicAgentSpace
      agent_space_name: BasicAgentSpace
      description: Basic agent space for security code review
      code_review_settings:
        controls_scanning: true
        general_purpose_scanning: true
      tags:
        Environment: Development
        Purpose: BasicCodeReview

    - name: AwsResourcesAgentSpace
      agent_space_name: AwsResourcesAgentSpace
      deletion_policy: Retain
      update_replace_policy: Retain
      description: Agent space with AWS resources configuration
      aws_resources:
        iam_roles:
          - arn:aws:iam::123456789012:role/SecurityAgentRole
          - arn:aws:iam::123456789012:role/SecurityAgentExecutionRole
        lambda_function_arns:
          - arn:aws:lambda:us-east-1:123456789012:function:SecurityAnalyzer
          - arn:aws:lambda:us-east-1:123456789012:function:ComplianceChecker
        log_groups:
          - /aws/securityagent/analysis
          - /aws/securityagent/compliance
        s3_buckets:
          - security-scan-results-bucket
          - compliance-reports-bucket
        secret_arns:
          - arn:aws:secretsmanager:us-east-1:123456789012:secret:github-token
          - arn:aws:secretsmanager:us-east-1:123456789012:secret:gitlab-token
        vpcs:
          - vpc_arn: arn:aws:ec2:us-east-1:123456789012:vpc/vpc-0123456789abcdef0
            subnet_arns:
              - arn:aws:ec2:us-east-1:123456789012:subnet/subnet-0123456789abcdef0
              - arn:aws:ec2:us-east-1:123456789012:subnet/subnet-0abcdef0123456789
            security_group_arns:
              - arn:aws:ec2:us-east-1:123456789012:security-group/sg-0123456789abcdef0
              - arn:aws:ec2:us-east-1:123456789012:security-group/sg-0abcdef0123456789
          - vpc_arn: arn:aws:ec2:us-west-2:123456789012:vpc/vpc-abcdef0123456789
            subnet_arns:
              - arn:aws:ec2:us-west-2:123456789012:subnet/subnet-abcdef0123456789
            security_group_arns:
              - arn:aws:ec2:us-west-2:123456789012:security-group/sg-abcdef0123456789
      code_review_settings:
        controls_scanning: true
        general_purpose_scanning: true
      kms_key_id: arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012
      tags:
        Environment: Production
        Application: ComplianceScanning
        CostCenter: Security

    - name: IntegratedResourcesAgentSpace
      agent_space_name: IntegratedResourcesAgentSpace
      description: Agent space with integrated repository and document resources
      code_review_settings:
        controls_scanning: true
        general_purpose_scanning: false
      integrated_resources:
        - integration: github
          provider_resources:
            - github_repository:
                owner: my-organization
                name: security-policies-repo
              github_capabilities:
                leave_comments: true
                remediate_code: true
        - integration: gitlab
          provider_resources:
            - gitlab_repository:
                namespace: my-group
                name: compliance-automation-repo
              gitlab_capabilities:
                leave_comments: true
                remediate_code: true
        - integration: bitbucket
          provider_resources:
            - bitbucket_repository:
                workspace: my-workspace
                name: code-standards-repo
              bitbucket_capabilities:
                leave_comments: true
                remediate_code: false
        - integration: confluence
          provider_resources:
            - confluence_document:
                space_key: SEC
                page_id: "12345"
                name: SecurityGuidelines
                space_title: Security Documentation
                title: Code Security Guidelines
              confluence_capabilities:
                fetch_document: true
                create_document: true
                update_document: true
      target_domain_ids:
        - d-1234567890
        - d-0987654321
      tags:
        Environment: Production
        Application: IntegratedCodeReview
        Owner: SecurityEngineering

stack_tags:
  Test: securityagent-agentspace
