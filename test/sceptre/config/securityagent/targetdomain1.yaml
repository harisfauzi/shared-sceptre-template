---
template:
  type: file
  path: securityagent/target_domain.yaml.j2

sceptre_user_data:
  project_code: "{{ project_code }}"
  source_repo_url: "{{ git_repo }}"
  description: CloudFormation template to test SecurityAgent Target Domain with comprehensive Jinja2 template coverage.
  target_domains:
    - name: BasicTargetDomain
      target_domain_name: basic.example.com
      verification_method: DNS
      tags:
        Environment: Development
        Purpose: BasicSecurityAgentDomain

    - name: VerifiedTargetDomain
      target_domain_name: verified.example.com
      verification_method: EMAIL
      deletion_policy: Retain
      update_replace_policy: Retain
      tags:
        Environment: Staging
        Application: EmailVerifiedDomain
        Owner: SecurityTeam

    - name: ProductionTargetDomain
      target_domain_name: api.production.example.com
      verification_method: DNS
      deletion_policy: Retain
      update_replace_policy: Retain
      tags:
        Environment: Production
        Application: ProductionSecurityAgent
        CostCenter: Security
        DataClassification: Sensitive
        Owner: CloudEngineering

stack_tags:
  Test: securityagent-target-domain
