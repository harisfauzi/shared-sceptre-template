---
template:
  type: file
  path: appstream/stack.yaml.j2

sceptre_user_data:
  project_code: "{{project_code}}"
  source_repo_url: "{{git_repo}}"
  stacks:
    - name: Stack1
      stack_name: MyAppStreamStack1
      description: "Production stack with full configuration including agent access and storage connectors"
      display_name: "My Stack 1"
      delete_storage_connectors: true
      feedback_url: "https://feedback.example.com"
      redirect_url: "https://redirect.example.com"
      agent_access_config:
        screen_image_format: PNG
        screen_resolution: 1920x1080
        screenshots_upload_enabled: true
        s3_bucket_arn: "arn:aws:s3:::my-appstream-screenshots"
        user_control_mode: ENABLED
        settings:
          - agent_action: CLIPBOARD_COPY_FROM_LOCAL_DEVICE
            permission: ALLOW
          - agent_action: CLIPBOARD_PASTE_TO_LOCAL_DEVICE
            permission: ALLOW
          - agent_action: FILE_DOWNLOAD
            permission: ALLOW
          - agent_action: FILE_UPLOAD
            permission: DENY
      application_settings:
        enabled: true
        settings_group: MySettingsGroup
      storage_connectors:
        - connector_type: HOMEFOLDERS
        - connector_type: GOOGLE_DRIVE
          domains:
            - example.com
            - mydomain.com
        - connector_type: ONE_DRIVE
          resource_identifier: "arn:aws:iam::123456789012:role/OneDriveRole"
      content_redirection:
        host_to_client:
          enabled: true
          allowed_urls:
            - "https://allowed1.example.com"
            - "https://allowed2.example.com"
          denied_urls:
            - "https://blocked.example.com"
      streaming_experience_settings:
        preferred_protocol: TCP
      user_settings:
        - action: CLIPBOARD_COPY_FROM_LOCAL_DEVICE
          permission: ALLOW
        - action: CLIPBOARD_PASTE_TO_LOCAL_DEVICE
          permission: ALLOW
          maximum_length: 200
        - action: FILE_DOWNLOAD
          permission: DENY
      deletion_policy: Retain
      update_replace_policy: Retain
      tags:
        Environment: Production
        Owner: TeamA
        CostCenter: Engineering
    - name: Stack2
      stack_name: MyAppStreamStack2
      description: "Development stack with minimal configuration"
      display_name: "My Stack 2"
      deletion_policy: Delete
      update_replace_policy: Delete
      tags:
        Environment: Development
        Owner: TeamB
    - name: Stack3
      stack_name: MyAppStreamStack3
      description: "QA stack with VPC endpoints and embed domains"
      display_name: "My Stack 3"
      access_endpoints:
        - endpoint_type: STREAMING
          vpce_id: vpce-12345678
      embed_host_domains:
        - "domain1.example.com"
        - "domain2.example.com"
        - "domain3.example.com"
      attributes_to_delete:
        - CLIPBOARD_COPY_FROM_LOCAL_DEVICE
      application_settings:
        enabled: false
      storage_connectors:
        - connector_type: HOMEFOLDERS
      tags:
        Environment: QA
        Owner: TeamC
