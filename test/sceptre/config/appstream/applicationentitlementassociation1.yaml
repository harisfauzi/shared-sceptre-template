---
template:
  type: file
  path: appstream/application_entitlement_association.yaml.j2

sceptre_user_data:
  project_code: "{{project_code}}"
  source_repo_url: "{{git_repo}}"
  application_entitlement_associations:
    - name: AppEntitlementAssociation1
      application_identifier: arn:aws:appstream:us-east-1:123456789012:application/default/MyApplication1
      entitlement_name: EntitlementA
      stack_name: MyAppStreamStack1
      deletion_policy: Retain
      update_replace_policy: Retain
    - name: AppEntitlementAssociation2
      application_identifier: arn:aws:appstream:us-east-1:123456789012:application/default/MyApplication2
      entitlement_name: EntitlementB
      stack_name: MyAppStreamStack2
      deletion_policy: Delete
      update_replace_policy: Delete
