---
template:
  type: file
  path: xray/transaction_search_config.yaml.j2

sceptre_user_data:
  project_code: "{{ project_code }}"
  source_repo_url: "{{ git_repo }}"
  description: "Sample X-Ray transaction search configs generated from Jinja2"
  transaction_search_configs:
    - name: DefaultIndexingConfig
      indexing_percentage: 5

    - name: HighTrafficIndexingConfig
      deletion_policy: Retain
      update_replace_policy: Retain
      indexing_percentage: 35

stack_tags:
  Test: xray-transaction-search-config
