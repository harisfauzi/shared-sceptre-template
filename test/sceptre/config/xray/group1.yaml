---
template:
  type: file
  path: xray/group.yaml.j2

sceptre_user_data:
  project_code: "{{ project_code }}"
  source_repo_url: "{{ git_repo }}"
  description: "Sample X-Ray groups generated from Jinja2"
  groups:
    - name: CheckoutServiceGroup
      group_name: CheckoutService
      filter_expression: 'service("checkout")'
      insights_configuration:
        insights_enabled: true
        notifications_enabled: false
      tags:
        Environment: Test
        Team: Platform

    - name: PaymentServiceGroup
      group_name: PaymentService
      deletion_policy: Retain
      update_replace_policy: Retain
      filter_expression: 'service("payments")'
      insights_configuration:
        insights_enabled: true
        notifications_enabled: true
      tags:
        Environment: Test
        Team: CorePayments

stack_tags:
  Test: xray-group
